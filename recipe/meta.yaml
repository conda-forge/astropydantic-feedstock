{% set name = "astropydantic" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/astropydantic-{{ version }}.tar.gz
  sha256: 273351fd61605d917ca32c1931540f449152fde8509e37d14b381f47ec90bdae

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - pydantic >2.0.0
    - astropy-base

test:
  imports:
    - astropydantic
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/astropydantic/
  summary: An (unofficial) package providing pydantic typing support for astropy unit types. Can be used to de(serialize) astropy quantities and units.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - JBorrow
    - iparask
